[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Procountor"
dynamic = ["version"]
description = "Python library for calling the Procountor REST API"
readme = "README.rst"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["procountor", "accounting", "rest", "api"]
authors = [
    { name = "Joonas Maliniemi", email = "joonas@vilkas.fi" },
    { name = "Tero Kotti", email = "tero@vilkas.fi" },
]
maintainers = [
    { name = "Vilkas Group", email = "info@vilkas.fi" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.31.0",
    "requests-toolbelt>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/vilkasgroup/Procountor"
Repository = "https://github.com/vilkasgroup/Procountor"
Documentation = "https://procountor.readthedocs.io"
Changelog = "https://github.com/vilkasgroup/Procountor/blob/master/HISTORY.rst"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bump-my-version>=0.28",
]

[tool.hatch.version]
path = "procountor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["procountor"]

[tool.hatch.build.targets.sdist]
include = [
    "procountor",
    "tests",
    "README.rst",
    "HISTORY.rst",
    "AUTHORS.rst",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = ["docs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501: long lines are tolerated in this codebase (descriptive error/doc strings).
ignore = ["E501"]

[tool.bumpversion]
current_version = "2.6.1"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "procountor/__init__.py"
search = "__version__ = '{current_version}'"
replace = "__version__ = '{new_version}'"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "current_version = \"{current_version}\""
replace = "current_version = \"{new_version}\""
